name: Sync Plugin Repository

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sources.json'
      - 'scripts/sync-plugins.mjs'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync pluginmaster.json
        run: node scripts/sync-plugins.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet pluginmaster.json; then
            echo "No changes to pluginmaster.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "chore: sync pluginmaster.json"
          git push
